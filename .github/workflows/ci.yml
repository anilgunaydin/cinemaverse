name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: TypeScript / Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint (if configured)
        run: npx eslint . --ext .ts,.tsx --max-warnings 0 || true

      - name: PWA asset check
        run: |
          test -f public/manifest.json
          test -f public/sw.js
          test -f public/icons/icon-512.png
          test -f public/icons/maskable-512.png
          test -f public/screenshots/keşfet-wide.png
          echo "PWA assets OK"

  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run --reporter=verbose

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # CI ortaminda gizli anahtar olmasa da build kirilmamali.
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-build-only-not-a-real-secret' }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || '' }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY || '' }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || '' }}

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build for E2E
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-build-only-not-a-real-secret' }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || '' }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY || '' }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || '' }}

      - name: Prepare test database
        run: |
          npx tsx scripts/apply-migrations.ts
          npx tsx scripts/seed-ci.ts

      - name: Start dev server
        run: |
          nohup npm run dev > dev.log 2>&1 &
          echo $! > dev.pid
          sleep 15
          curl -f http://localhost:3000/api/health || sleep 10
          curl -f http://localhost:3000/api/health || { cat dev.log; exit 1; }

      - name: Run Playwright tests
        run: npx playwright test --reporter=github

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Stop dev server
        if: always()
        run: |
          if [ -f dev.pid ]; then kill $(cat dev.pid) || true; fi

  verify-modules:
    name: Verify Modules (Integration)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-build-only-not-a-real-secret' }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || '' }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY || '' }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || '' }}

      - name: Prepare test database
        run: |
          npx tsx scripts/apply-migrations.ts
          npx tsx scripts/seed-ci.ts

      - name: Start dev server
        run: |
          nohup npm run dev > dev.log 2>&1 &
          echo $! > dev.pid
          sleep 15
          curl -f http://localhost:3000/api/health || sleep 10
          curl -f http://localhost:3000/api/health || { cat dev.log; exit 1; }

      - name: Run verify-modules
        run: node scripts/verify-modules.mjs http://localhost:3000

      - name: Stop dev server
        if: always()
        run: |
          if [ -f dev.pid ]; then kill $(cat dev.pid) || true; fi

  notify:
    name: Notify (on failure)
    if: failure()
    needs: [lint-and-typecheck, unit-tests, build, e2e-tests, verify-modules]
    runs-on: ubuntu-latest
    steps:
      - name: Notify failure
        run: echo "CI failed — check GitHub Actions for details"