<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a94f"/>
      <stop offset="100%" style="stop-color:#0f0f12"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <g transform="translate(256, 256)">
    <!-- Film strip -->
    <rect x="-120" y="-80" width="240" height="160" rx="12" fill="none" stroke="#0f0f12" stroke-width="8"/>
    <rect x="-108" y="-68" width="216" height="136" rx="6" fill="#0f0f12"/>
    <!-- Sprocket holes -->
    <circle cx="-96" cy="0" r="12" fill="#d4a94f"/>
    <circle cx="96" cy="0" r="12" fill="#d4a94f"/>
    <!-- Play triangle -->
    <polygon points="-20,-35 40,0 -20,35" fill="#d4a94f"/>
  </g>
</svg>